name: Validate Site

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "15 6,18 * * *"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify digest manifest
        run: python scripts/update-news-digest-index.py --check

      - name: Verify privacy inventory and public artifact boundary
        run: |
          python -B scripts/privacy_check.py
          python -B scripts/test-privacy.py
          python -B scripts/build-public.py --output ${{ runner.temp }}/axy-public
          python -B scripts/check-internal-links.py --site ${{ runner.temp }}/axy-public
          python -B scripts/test-internal-links.py
          python -B scripts/privacy_check.py --site ${{ runner.temp }}/axy-public
          python -B scripts/test-artifact-privacy.py

      - name: Verify SEO output and validate sitemap and RSS
        run: |
          python scripts/build-seo.py --check
          python scripts/check-seo.py

      - name: Verify homepage gallery payload
        run: python scripts/rebuild-homepage-gallery.py --check

      - name: Verify homepage image rendering
        run: python scripts/test-homepage-images.py

      - name: Run gallery provenance and prompt regressions
        run: python -B scripts/test-gallery-provenance.py

      - name: Build SEO feed and run metadata regressions
        run: |
          python scripts/build-seo.py
          python scripts/test-seo.py

      - name: Check skip links and landmarks
        run: python scripts/render-navigation.py --check
      # No AA acquisition or snapshot validation until permission (#615, #1508).
      - name: Verify A-List withdrawal and disabled acquisition
        run: python scripts/test-a-list-sync.py
      - name: Check generated contact links
        run: python scripts/render-contact.py --check

      - name: Validate static site structure
        run: python scripts/validate-site.py

  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"

      - name: Test the routed feed refresh
        run: node --test tests/refresh-routed-feed.test.mjs tests/routed-feed-freshness.test.mjs tests/news-order.test.mjs tests/feed-publication.test.mjs
      - name: Test performance receipt thresholds
        run: node --test tests/performance-result.test.mjs

      - name: Run gallery identity regression tests
        run: node --test tests/gallery-smoke.test.mjs

      - name: Install Playwright runtime
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local preview server
        run: python3 -m http.server 4173 >/tmp/axylusion-http.log 2>&1 &

      - name: Wait for preview server
        run: sleep 2

      - name: Run browser smoke tests
        run: node scripts/smoke-test-site.mjs --base-url http://127.0.0.1:4173

  publish-guard-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Gallery publish guard tests on PowerShell 7 (KOL-6327)
        shell: pwsh
        run: ./tests/gallery-publish-guard.tests.ps1

      - name: Gallery publish guard tests on Windows PowerShell 5.1 (KOL-6327)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/gallery-publish-guard.tests.ps1
