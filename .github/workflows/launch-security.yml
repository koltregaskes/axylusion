name: Launch security
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify intended headers, unused mirror and every meta CSP
        run: python -B scripts/meta_csp.py
      - name: Prove policy drift is rejected
        run: python -B scripts/test-security-headers.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - name: Verify scanner admission controls
        run: python scripts/test-source-scan.py
      - name: Redacted tracked-source scan
        run: python scripts/scan-source-secrets.py
  external-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test-external-links.py
      - run: python scripts/check-external-links.py
