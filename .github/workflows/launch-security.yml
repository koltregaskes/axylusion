name: Launch security
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - name: Verify scanner admission controls
        run: python scripts/test-source-scan.py
      - name: Redacted tracked-source scan
        run: python scripts/scan-source-secrets.py
      - name: Validate Cloudflare header payload
        run: python -m json.tool cloudflare-response-headers.json > /dev/null
  external-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check-external-links.py