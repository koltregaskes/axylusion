name: Launch contract
on: [push, pull_request, workflow_dispatch]
env:
  PLAYWRIGHT_CHANNEL: msedge
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
permissions:
  contents: read
jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check static build and SEO contract
        run: |
          python scripts/build-seo.py --check
          python scripts/check-seo.py
          python scripts/meta_csp.py
          python scripts/check-internal-links.py
          python -B scripts/test-navigation.py
          python scripts/validate-site.py
          test -s llms.txt
      - name: Install browser checks
        run: npm install --no-save --package-lock=false playwright@1.64.0 axe-core@4.10.3
      - run: microsoft-edge --version
      - run: node --test tests/browser-site.test.mjs
      - run: node scripts/check-overflow-browser.mjs
      - name: Build exact browser artifact
        run: python -B scripts/build-public.py --output ${{ runner.temp }}/axy-browser-public
      - name: All artifact routes at phone and desktop widths
        run: node scripts/launch-browser.mjs --site ${{ runner.temp }}/axy-browser-public
