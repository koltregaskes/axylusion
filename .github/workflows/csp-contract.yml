name: Application CSP contract
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  PLAYWRIGHT_CHANNEL: msedge
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
jobs:
  csp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.64.0 axe-core@4.10.3
      - run: node scripts/check-csp-capture.mjs
      - run: LAUNCH_BROWSER_PATH=$(command -v microsoft-edge) node scripts/launch-browser.mjs
