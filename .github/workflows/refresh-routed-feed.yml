name: Refresh routed feed

on:
  workflow_dispatch:
  schedule:
    # 05:15 UTC. Every source in the shared news config is fetched. A source
    # that cannot be fetched fails this run by name and records failures alongside successful-source items.
    # A successful fetch commits news-feed-latest.json, including an empty
    # article list when nothing matches the Axy Lusion filter.
    # The existing legacy branch Pages build is the only deployment route.
    - cron: '15 5 * * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-routed-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout news routing config
        uses: actions/checkout@v6
        with:
          repository: koltregaskes/ai-resource-hub
          ref: main
          path: .news-pipeline
          persist-credentials: false
          sparse-checkout: shared/website-tools/pipelines/news
          sparse-checkout-cone-mode: true

      - name: Fetch sources and apply the Axy Lusion filter
        id: fetch
        continue-on-error: true
        run: node scripts/refresh-routed-feed.mjs --pipeline .news-pipeline/shared/website-tools/pipelines/news

      - name: Commit the fetched feed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- news-digests/news-feed-latest.json
          if git diff --cached --quiet; then
            echo "No routed feed changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: refresh routed news feed"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Push the refreshed feed
        if: steps.commit.outputs.committed == 'true'
        run: git push origin "HEAD:${GITHUB_REF_NAME}"

      # GITHUB_TOKEN pushes do not start legacy Pages builds. Reuse that build,
      # rather than duplicating its deploy steps. Branch dispatches never publish.
      - name: Request the existing Pages build
        if: steps.commit.outputs.committed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --jq '.url'

      - name: Report incomplete source coverage
        if: steps.fetch.outcome == 'failure'
        run: exit 1
