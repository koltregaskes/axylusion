name: Live main parity
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare the public site with a frozen main commit
        run: python scripts/check-live-parity.py --ref origin/main
